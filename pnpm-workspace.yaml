packages:
  - apps/*
  - packages/*

overrides:
  react: 19.1.0
  react-dom: 19.1.0
  react-native: 0.81.5

allowBuilds:
  '@firebase/util': true
  protobufjs: true
  sharp: true
  unrs-resolver: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@firebase/util'
  - protobufjs
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - date-fns@4.4.0
  - '@types/react@19.2.17'
  - '@react-navigation/elements@2.9.21'
  - '@react-navigation/bottom-tabs@7.17.1'
  - '@react-navigation/core@7.19.0'
  - '@react-navigation/native@7.3.0'
  - '@react-navigation/routers@7.5.6'
